    arg("room.schemaLocation", layout.buildDirectory.dir("room-schemas").get().asFile.absolutePath)
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}

// Value from local.properties, then from the environment, then the default.
def openExteraProperty(String propName, String envName, String defaultValue) {
    def value = getProps(propName)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(envName)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        return defaultValue
    }
    return value.toString().trim()
}

def openExteraAppId() {
    def value = openExteraProperty("openextera.appId", "OPENEXTERA_APP_ID", "0")
    if (!value.isInteger()) {
        throw new GradleException("openextera.appId / OPENEXTERA_APP_ID must be a number, got '$value'")
    }
    return value.toInteger()
}

// There is no google-services.json for OpenExtera yet; apply the plugin only when one is provided.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility
