include ':TMessagesProj'
include ':TMessagesProj_App'
// OpenExtera builds only the regular app module. The upstream Telegram flavours
// (TMessagesProj_AppHuawei, TMessagesProj_AppHockeyApp, TMessagesProj_AppStandalone,
// TMessagesProj_AppTests) are kept in the tree for easier upstream merges but are not
// part of the build: they depend on Telegram's Firebase/Crashlytics/HMS configuration.
include ':jlatexmath'
project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")
